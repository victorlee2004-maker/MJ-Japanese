<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习进度 - MJ日语</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">日</span>
                <div class="logo-text">
                    <h1>学习进度</h1>
                    <p class="subtitle">跟踪你的日语学习进展</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="themeToggle" title="切换主题">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <a href="index.html" class="btn-icon" title="Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>

        <main class="main">
            <div class="progress-container">
                <div class="progress-header">
                    <h2>整体进度</h2>
                    <div class="progress-stats">
                        <div class="stat-card">
                            <div class="stat-value" id="totalArticles">0</div>
                            <div class="stat-label">总文章数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="completedArticles">0</div>
                            <div class="stat-label">已完成</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="totalWords">0</div>
                            <div class="stat-label">学习词汇</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="studyDays">0</div>
                            <div class="stat-label">学习天数</div>
                        </div>
                    </div>
                </div>

                <div class="progress-chart">
                    <h3>文章完成进度</h3>
                    <div class="progress-bars" id="progressBars">
                        <!-- 进度条动态生成 -->
                    </div>
                </div>

                <div class="recent-activity">
                    <h3>最近学习</h3>
                    <div class="activity-list" id="activityList">
                        <!-- 活动列表动态生成 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderProgress();
        });
    </script>
</body>
</html>
