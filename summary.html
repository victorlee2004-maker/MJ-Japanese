<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习总结 - MJ日语</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">日</span>
                <div class="logo-text">
                    <h1>学习总结</h1>
                    <p class="subtitle">回顾你的日语学习成果</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="themeToggle" title="切换主题">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <a href="index.html" class="btn-icon" title="Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>

        <main class="main">
            <div class="summary-container">
                <div class="summary-header">
                    <h2>学习总结报告</h2>
                    <button class="btn-primary" id="btnGenerateSummary">生成总结</button>
                </div>

                <div class="summary-content" id="summaryContent">
                    <div class="summary-placeholder">
                        <div class="placeholder-icon">📝</div>
                        <h3>点击"生成总结"查看学习成果</h3>
                        <p>系统将分析你的学习数据，生成详细的学习总结报告</p>
                    </div>
                </div>

                <div class="summary-sections" id="summarySections" style="display:none;">
                    <div class="summary-card">
                        <h3>📊 学习概况</h3>
                        <div class="summary-stats" id="summaryStats"></div>
                    </div>

                    <div class="summary-card">
                        <h3>📚 文章掌握情况</h3>
                        <div class="article-mastery" id="articleMastery"></div>
                    </div>

                    <div class="summary-card">
                        <h3>🔤 词汇积累</h3>
                        <div class="vocabulary-summary" id="vocabularySummary"></div>
                    </div>

                    <div class="summary-card">
                        <h3>💡 学习建议</h3>
                        <div class="learning-suggestions" id="learningSuggestions"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.getElementById('btnGenerateSummary').addEventListener('click', generateSummary);
        });
    </script>
</body>
</html>
